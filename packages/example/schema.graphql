type Counter @entity(immutable: false) {
  id: ID!
  value: BigInt!
  "newValue * Counter.multiplier — reads multiplier via try_multiplier(). Stays 0 when the call reverts (e.g. no captureViewMocks)."
  scaledValue: BigInt!
}

type SignedCounter @entity(immutable: false) {
  id: ID!
  value: BigInt!
}

"Populated from the ConfigUpdated(Config) struct event — exercises tuple decoding."
type Config @entity(immutable: false) {
  id: ID!
  fee: BigInt!
  offset: BigInt!
  treasury: Bytes!
  active: Boolean!
}
