type Counter @entity(immutable: false) {
  id: ID!
  value: BigInt!
  "newValue * Counter.multiplier — reads multiplier via try_multiplier(). Stays 0 when the call reverts (e.g. no captureViewMocks)."
  scaledValue: BigInt!
}

type SignedCounter @entity(immutable: false) {
  id: ID!
  value: BigInt!
}

"Populated from the ConfigUpdated(Config) struct event — exercises tuple decoding."
type Config @entity(immutable: false) {
  id: ID!
  fee: BigInt!
  offset: BigInt!
  treasury: Bytes!
  active: Boolean!
}

"One row per ValueSet. graph-node assigns `id` and `timestamp` itself; the mapping's values are ignored."
type ValueSample @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  value: BigInt!
}

type ValueStats @aggregation(intervals: ["hour"], source: "ValueSample") {
  id: Int8!
  timestamp: Timestamp!
  total: BigInt! @aggregate(fn: "sum", arg: "value")
}

"Written once by the `once` block handler from the data source context."
type Init @entity(immutable: true) {
  id: ID!
  label: String!
  threshold: BigInt!
  address: Bytes!
  blockNumber: BigInt!
}

"One row per block, written by the unfiltered block handler."
type BlockTick @entity(immutable: true) {
  id: ID!
  number: BigInt!
  timestamp: BigInt!
}

"ValueSet seen through the CounterClone template (keyed by emitting address)."
type CloneValue @entity(immutable: false) {
  id: ID!
  value: BigInt!
  hasContext: Boolean!
  "Context key `pair`, which only a test override sets (the template has no manifest context)."
  pair: String
}
