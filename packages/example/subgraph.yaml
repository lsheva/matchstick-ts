specVersion: 1.1.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Counter
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000001"
      abi: Counter
    context:
      label:
        type: String
        data: "primary"
      threshold:
        type: BigInt
        data: "100"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Counter
        - SignedCounter
        - Config
        - ValueSample
        - Init
        - BlockTick
      abis:
        - name: Counter
          file: ./abis/Counter.json
      blockHandlers:
        - handler: handleInit
          filter:
            kind: once
        - handler: handleBlock
      eventHandlers:
        - event: ValueSet(uint256)
          handler: handleValueSet
        - event: SignedValueSet(int256)
          handler: handleSignedValueSet
        - event: ConfigUpdated((uint256,int256,address,bool))
          handler: handleConfigUpdated
      file: ./src/mapping.ts
templates:
  - kind: ethereum
    name: CounterClone
    network: mainnet
    source:
      abi: Counter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CloneValue
      abis:
        - name: Counter
          file: ./abis/Counter.json
      eventHandlers:
        - event: ValueSet(uint256)
          handler: handleCloneValueSet
      file: ./src/mapping.ts
