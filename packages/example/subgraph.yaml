specVersion: 1.0.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Counter
    network: mainnet
    source:
      address: "0x0000000000000000000000000000000000000001"
      abi: Counter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Counter
        - SignedCounter
        - Config
      abis:
        - name: Counter
          file: ./abis/Counter.json
      eventHandlers:
        - event: ValueSet(uint256)
          handler: handleValueSet
        - event: SignedValueSet(int256)
          handler: handleSignedValueSet
        - event: ConfigUpdated((uint256,int256,address,bool))
          handler: handleConfigUpdated
      file: ./src/mapping.ts
